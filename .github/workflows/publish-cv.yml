name: Build CV Light

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:

  # Validate the static site on PRs; publish it only after merging to main.
  build-site:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build welcome, CV, and Projects pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 site/render.py

      - name: Upload rendered site
        uses: actions/upload-artifact@v7
        with:
          name: cv-site
          path: build/public
          if-no-files-found: error
          retention-days: 1

  # Render on Windows, where Bahnschrift is installed.
  build-light:
    runs-on: windows-2025

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build light PDF
        uses: ./.github/actions/build-cv
        with:
          mode: light

  build-dark:
    uses: ./.github/workflows/build-cv-dark.yml

  # Publish on Ubuntu, which supports the Pages deployment actions.
  # Both PDFs are packaged with the same site deployment.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build-light, build-dark, build-site]
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download rendered site
        uses: actions/download-artifact@v8
        with:
          name: cv-site
          path: build/public

      - name: Download PDFs
        uses: actions/download-artifact@v8
        with:
          pattern: cv-@(light|dark)
          merge-multiple: true
          path: build/public

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload published files
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/public

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
