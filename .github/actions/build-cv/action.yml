name: Build CV PDF
description: Compile and upload one CV palette on Windows

inputs:
  mode:
    description: CV palette (light or dark)
    required: true

runs:
  using: composite
  steps:
    - name: Install Typst
      uses: typst-community/setup-typst@v5
      with:
        typst-version: "0.15.1"

    - name: Verify Bahnschrift is available
      shell: pwsh
      run: |
        $fonts = typst fonts
        if ($LASTEXITCODE -ne 0) {
          throw "Could not list fonts."
        }
        if (-not ($fonts -match 'Bahnschrift')) {
          throw "Bahnschrift is unavailable on this runner."
        }

    - name: Build PDF
      shell: pwsh
      env:
        CV_MODE: ${{ inputs.mode }}
      run: |
        New-Item -ItemType Directory -Force -Path build | Out-Null
        typst compile --input "mode=$env:CV_MODE" cv.typ "build/cv-$env:CV_MODE.pdf"
        if ($LASTEXITCODE -ne 0) {
          throw "CV compilation failed."
        }

    - name: Upload PDF
      uses: actions/upload-artifact@v7
      with:
        name: cv-${{ inputs.mode }}
        path: build/cv-${{ inputs.mode }}.pdf
        if-no-files-found: error
        retention-days: 1
